<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="color.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Color Flipper</h1>
      <div class="color-display">
        Background Color: <span id="colorName">#f0f0f0</span>
      </div>
      <button class="flip-btn" id="flipBtn">Click me!</button>
      <div class="mode-toggle">
        <button class="mode-btn active" id="simpleMode">Simple</button>
        <button class="mode-btn" id="hexMode">Hex</button>
      </div>
    </div>
    <script src="color.js"></script>
  </body>
</html>
